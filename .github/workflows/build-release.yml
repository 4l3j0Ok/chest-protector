name: Build Release Jar

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build tagged release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build jar
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          ./gradlew clean build -Pmod_version="$VERSION"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chest-protector-${{ github.ref_name }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Attach jar to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          for attempt in {1..12}; do
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              gh release upload "$TAG_NAME" build/libs/*.jar --clobber
              exit 0
            fi
            sleep 5
          done
          echo "Release $TAG_NAME was not found after waiting for semantic-release." >&2
          exit 1
