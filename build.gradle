plugins {
    id 'fabric-loom' version "${loom_version}"
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
loom {
    splitEnvironmentSourceSets()
    mods {
        "chest_protector" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }
// A toolchain pins the JDK used to compile, so the build no longer depends on whatever
// JAVA_HOME happens to be set to. Without it Gradle uses the JVM running the daemon, which
// fails outright when that is a JRE with no javac.
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
